name: Use ARC in a workflow

on:
  workflow_dispatch:

jobs:
  build_on_arc:
    name: Build on ARC self-hosted runner
    runs-on:
      - self-hosted
      - arc
      - aci-lab2
    steps:
      - name: Print runner info
        run: |
          echo "Runner: $RUNNER_NAME ($RUNNER_OS $RUNNER_ARCH)"
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node version
        run: node -v || echo "Node not installed on runner"
